<!DOCTYPE html>
<html lang="zh-cn" class="scroll-smooth" data-theme="light">

<head>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
    <meta charset="UTF-8">
    <title>卦灵AI - 八字排盘</title>
    <link rel="icon" href="assets/images/icon.jpeg" />
    <link rel="stylesheet" href="css/main.css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/new-ui.css?v=20260816-nui15" />
    <script src="js/libs/marked.min.js"></script>
    <script src="js/libs/marked-cjk-patch.js?v=20260816-4"></script>
    <script src="js/libs/font-awesome.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/gualing-crypto-api.js"></script>
    <script src="js/user-center.js"></script>
    <script src="js/bazi.js"></script>
    <script src="js/news-carousel.js"></script>
</head>

<body class="min-h-screen">
    <!-- 导航栏 -->
    <div class="navbar bg-[#fffbf5]/95 backdrop-blur shadow-sm sticky top-0 z-50 border-b border-[#e6ded5]">
        <div class="navbar-start">
            <a href="index.html" class="btn btn-ghost heading-font text-2xl text-[#9e1c26]">卦灵AI</a>
        </div>
        <div class="navbar-center">
            <a class="btn btn-ghost heading-font text-2xl">八字排盘</a>
        </div>
        <div class="navbar-end">
            <div class="flex items-center gap-2">
                <div class="dropdown dropdown-end">
                    <label tabindex="0" class="btn btn-ghost"><i class="fa-solid fa-language fa-lg"></i></label>
                    <ul tabindex="0"
                        class="dropdown-content z-[100] menu p-2 shadow bg-base-100 rounded-box w-32 border border-[#e6ded5]">
                        <li><a onclick="utils.setLanguage('zh-CN')">中文</a></li>
                        <li><a onclick="utils.setLanguage('en-US')">English</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- 主要内容 -->
    <div class="container mx-auto px-4 py-8 pb-28">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- 左侧表单 -->
            <div class="lg:w-1/2">
                <div class="card shadow-xl">
                    <div class="card-body">
                        <h2 class="heading-font text-2xl mb-4 text-[#9e1c26] border-l-4 border-[#9e1c26] pl-3">八字排盘 <p
                                class="text-xs text-font">排盘由 问真八字 提供</p>
                        </h2>

                        <!-- 性别选择 -->
                        <div class="form-control mb-4">
                            <label class="label">
                                <span class="label-text text-font">性别</span>
                                <span class="gender-alt label-text-alt text-error"></span>
                            </label>
                            <div class="join w-full gender-group">
                                <button class="join-item btn btn-primary flex-1 gender-btn btn-active"
                                    data-value=1>男</button>
                                <button class="join-item btn btn-outline flex-1 gender-btn" data-value=0>女</button>
                            </div>
                            <input type="hidden" name="gender" value="男">
                        </div>

                        <!-- 出生日期 -->
                        <div class="form-control w-full mb-4">
                            <label class="label">
                                <span class="label-text text-font">出生日期（真太阳时、早晚子时、公历）</span>
                                <span class="birth-alt label-text-alt text-error"></span>
                            </label>
                            <input type="text" name="birth" class="input input-bordered text-font"
                                placeholder="例如：1990-01-01 12:00" />
                        </div>

                        <!-- 排盘按钮 -->
                        <button class="btn btn-primary w-full text-lg calculate">开始排盘</button>


                    </div>
                </div>
            </div>

            <!-- 加载动画 -->
            <div class="result-divider divider lg:divider-horizontal p-2 hidden">
                <p class="result-divider-text">排盘结果</p>
                <span class="loading loading-dots loading-lg hidden"></span>
            </div>

            <!-- 卦象结果 -->
            <div class="lg:w-1/2">
                <div class="result hidden">
                    <div class="card shadow-xl">
                        <div class="card-body">
                            <h2 class="heading-font text-2xl mb-6">排盘结果</h2>

                            <!-- 问事详情，排盘后，将收集的信息汇总到这里。是个daisyui的code类型，附带一个复制按钮。 -->
                            <div class="mockup-code w-full text-font">
                                <pre><code class="code-content text-font"></code></pre>
                                <button class="btn btn-ghost code-copy-btn">复制</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer footer-center bg-base-100 bg-opacity-80 text-base-content rounded">
        <div>
            <p class="text-font">
                <span class="heading-font text-xl">卦灵AI</span><br />
                <span class="footer-motto text-xl">融古通今，智解天机</span><br />
                <a class="text-sm" href="https://yunsisanren.top" target="_blank">@云笥散人</a>
            </p>
        </div>
    </footer>
    <script src="js/ui-atmosphere.js?v=20260816-nui15"></script>
</body>

</html>
