<!DOCTYPE html>
<html lang="zh-cn" class="scroll-smooth" data-theme="light">

<head>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
    <meta charset="UTF-8">
    <title>卦灵AI - 十二宫神掌</title>
    <link rel="icon" href="assets/images/icon.jpeg" />
    <link rel="stylesheet" href="css/main.css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/new-ui.css?v=20260816-nui2" />
    <script src="js/libs/marked.min.js"></script>
    <script src="js/libs/marked-cjk-patch.js?v=20260816-4"></script>
    <script src="js/libs/font-awesome.js"></script>
    <script src="js/libs/lunar.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/gualing-crypto-api.js"></script>
    <script src="js/user-center.js"></script>
    <script src="js/palace.js"></script>
    <script src="js/news-carousel.js"></script>
</head>

<body class="min-h-screen">
    <!-- 导航栏 -->
    <div class="navbar bg-[#fffbf5]/95 backdrop-blur shadow-sm sticky top-0 z-50 border-b border-[#e6ded5]">
        <div class="navbar-start">
            <a href="index.html" class="btn btn-ghost heading-font text-2xl text-[#9e1c26]">卦灵AI</a>
        </div>
        <div class="navbar-center">
            <a class="btn btn-ghost heading-font text-2xl">十二宫神掌</a>
        </div>
        <div class="navbar-end">
            <div class="flex items-center gap-2">
                <div class="dropdown dropdown-end">
                    <label tabindex="0" class="btn btn-ghost"><i class="fa-solid fa-language fa-lg"></i></label>
                    <ul tabindex="0"
                        class="dropdown-content z-[100] menu p-2 shadow bg-base-100 rounded-box w-32 border border-[#e6ded5]">
                        <li><a onclick="utils.setLanguage('zh-CN')">中文</a></li>
                        <li><a onclick="utils.setLanguage('en-US')">English</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- 主要内容 -->
    <div class="container mx-auto px-4 py-8 pb-28">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- 输入表单 -->
            <div class="lg:w-1/2">
                <div class="card shadow-xl">
                    <div class="card-body">
                        <h2
                            class="translation heading-font text-2xl mb-4 text-[#9e1c26] border-l-4 border-[#9e1c26] pl-3">
                            事主信息</h2>

                        <!-- 性别 -->
                        <div class="form-control">
                            <label class="label pt-0 pb-1">
                                <span class="translation label-text font-bold text-gray-600">性别</span>
                                <span class="gender-alt label-text-alt text-error"></span>
                            </label>
                            <div class="join w-full gender-group grid grid-cols-2">
                                <button class="translation join-item btn btn-sm btn-gugong gender-btn btn-active"
                                    data-value="男">男</button>
                                <button
                                    class="translation join-item btn btn-sm btn-outline gender-btn hover:bg-[#fff3e0] hover:text-[#9e1c26] hover:border-[#9e1c26]"
                                    data-value="女">女</button>
                            </div>
                            <input type="hidden" class="gender" name="gender" value="男">
                        </div>

                        <!-- 生辰八字 -->
                        <div class="form-control">
                            <label class="label">
                                <span class="translation form-label">生辰</span>
                                <span
                                    class="translation birthdatetime-alt label-text-alt text-warning text-font">非必填项，求问与事主强相关的事情时使用</span>
                            </label>
                            <input class="birthdatetime input input-bordered text-font" type="datetime-local"
                                name="birthdatetime">
                        </div>

                        <!-- 用神 -->
                        <div class="form-control">
                            <label class="label">
                                <span class="translation form-label">用神</span>
                                <span class="yongShen-alt label-text-alt text-error"></span>
                            </label>
                            <select class="yongShen select select-bordered text-font" name="yongShen">
                                <option class="translation" disabled selected>请选择</option>
                            </select>
                            <label class="label">
                                <span class="yongShen-desc label-text-alt text-info text-font"></span>
                            </label>
                        </div>

                        <!-- 问事类型 -->
                        <div class="form-control">
                            <label class="label">
                                <span class="translation form-label">问事类型</span>
                                <span class="disaster-alt label-text-alt text-error"></span>
                            </label>
                            <select class="disaster select select-bordered text-font" name="disaster">
                                <option class="translation" disabled selected>请选择</option>
                                <option class="translation">一般事情</option>
                                <option class="translation">病灾</option>
                            </select>
                        </div>

                        <!-- 问事日时 -->
                        <div class="form-control">
                            <label class="label">
                                <span class="translation form-label">问事日时</span>
                                <span class="datetime-alt label-text-alt text-error"></span>
                            </label>
                            <input class="datetime input input-bordered text-font" type="datetime-local"
                                name="datetime">
                        </div>

                        <!-- 问事详情 -->
                        <div class="form-control">
                            <label class="label">
                                <span class="translation form-label">问事详情</span>
                                <span class="question-alt label-text-alt text-error"></span>
                            </label>
                            <textarea class="question textarea textarea-bordered h-24 text-font" name="question"
                                placeholder="请详细描述您的问题..."></textarea>
                        </div>

                        <div class="divider"></div>

                        <div class="card-actions">
                            <button class="translation calculate btn btn-primary w-full text-lg">开始排盘</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 加载动画 -->
            <div class="result-divider divider lg:divider-horizontal p-2 hidden">
                <p class="translation result-divider-text">排盘结果</p>
                <span class="loading loading-dots loading-lg hidden"></span>
            </div>

            <!-- 结果显示 -->
            <div class="lg:w-1/2">
                <div class="result hidden">
                    <div class="card shadow-xl">
                        <div class="card-body">
                            <h2 class="translation heading-font text-2xl mb-6">排盘结果</h2>
                            <div class="join w-full result-tabs-group mb-4">
                                <button class="join-item btn btn-gugong flex-1 result-tab-btn btn-active"
                                    data-target="panel-main">本宫</button>
                                <button class="join-item btn btn-outline flex-1 result-tab-btn"
                                    data-target="panel-addit">变宫</button>
                            </div>
                            <div id="panel-main"
                                class="bg-base-100 border border-base-300 rounded-b-box rounded-tr-box p-6">
                                <div class="zodiac_tab_1 text-font text-sm"></div>
                            </div>
                            <div id="panel-addit"
                                class="hidden bg-base-100 border border-base-300 rounded-b-box rounded-tr-box p-6">
                                <div class="zodiac_tab_2 text-font text-sm"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer footer-center bg-base-100 bg-opacity-80 text-base-content rounded">
        <div>
            <p class="text-font">
                <span class="heading-font text-xl">卦灵AI</span><br />
                <span class="footer-motto text-xl">融古通今，智解天机</span><br />
                <a class="text-sm" href="https://yunsisanren.top" target="_blank">@云笥散人</a>
            </p>
        </div>
    </footer>
    <script src="js/ui-atmosphere.js?v=20260816-nui2"></script>
</body>

</html>
