<!DOCTYPE html>
<html lang="zh-cn" class="scroll-smooth" data-theme="light">

<head>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
    <meta charset="UTF-8">
    <title>领取激活码 - 卦灵AI</title>
    <!-- 防封锁补丁：解决 Trusted Types 报错 -->
    <script>
        (function () {
            if (window.trustedTypes && window.trustedTypes.createPolicy) {
                if (!window.trustedTypes.defaultPolicy) {
                    const passThrough = (s) => s;
                    window.trustedTypes.createPolicy('default', {
                        createHTML: passThrough,
                        createScriptURL: passThrough,
                        createScript: passThrough,
                    });
                }
            }
        })();
    </script>
    <link rel="icon" href="assets/images/icon.jpeg" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="preconnect" href="https://challenges.cloudflare.com" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/new-ui.css?v=20260816-nui42" />
    <script src="js/libs/font-awesome.js"></script>
    <!-- Cloudflare Turnstile 改为显式渲染模式 -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body class="min-h-screen flex flex-col">
    <!-- 导航栏 -->
    <div class="navbar bg-[#fffbf5]/95 backdrop-blur shadow-sm sticky top-0 z-50 border-b border-[#e6ded5]">
        <div class="navbar-start">
            <a href="index.html" class="btn btn-ghost heading-font text-2xl text-[#9e1c26]">
                <i class="fa-solid fa-arrow-left mr-1 text-sm"></i> 返回首页
            </a>
        </div>
    </div>

    <!-- 2. 修改主要内容区：
            - 移除 py-16 (因为它会把内容往下推)
            - flex-1 占据所有剩余空间
            - 增加 pb-[10vh] 实现“视觉居中” (稍微往上提一点)
    -->
    <main class="flex-1 flex items-center justify-center px-4 pb-[15vh] md:pb-0">

        <!-- 针对移动端优化了 p-6 (原先 p-8 对小屏有点挤) -->
        <div class="card w-full max-w-lg bg-base-100 shadow-2xl p-6 md:p-8 border-2 border-[#e6ded5]">
            <div class="text-center mb-6 md:mb-8">
                <h1 class="heading-font text-3xl md:text-4xl mb-4 text-[#9e1c26]">结缘赠礼</h1>
                <p class="text-font text-gray-600 text-base md:text-lg">验证 Steam 账号，领取游戏激活码</p>
                <div class="divider before:bg-[#e6ded5] after:bg-[#e6ded5]"></div>
            </div>

            <!-- 状态机：区块 0：倒计时区 -->
            <div id="step-countdown" class="hidden flex flex-col items-center gap-6 w-full">
                <p class="text-[#9e1c26] classic-font text-lg md:text-xl text-center">
                    《石楠小馆：一斗浮生》<br>
                    <span class="text-gray-500 text-xs md:text-sm mt-1 inline-block">将于 2026年5月5日 08:00 开启结缘分发</span>
                </p>

                <!-- 【核心修复区】：改用 flex 居中容器，杜绝拉伸失真 -->
                <div class="flex justify-center items-center gap-3 sm:gap-4 w-full">

                    <!-- 注意：span.countdown 和它内部的 span 必须紧贴在同一行，消灭幽灵换行节点！ -->
                    <div
                        class="flex-1 max-w-[4.5rem] sm:max-w-[5.5rem] flex flex-col items-center justify-center p-2 sm:p-3 bg-[#fffbf5] border border-[#e6ded5] rounded-box text-[#9e1c26] shadow-sm">
                        <span class="countdown font-mono text-3xl sm:text-4xl"><span id="cd-days"
                                style="--value:0;"></span></span>
                        <span class="text-xs sm:text-sm classic-font mt-1">日</span>
                    </div>

                    <div
                        class="flex-1 max-w-[4.5rem] sm:max-w-[5.5rem] flex flex-col items-center justify-center p-2 sm:p-3 bg-[#fffbf5] border border-[#e6ded5] rounded-box text-[#9e1c26] shadow-sm">
                        <span class="countdown font-mono text-3xl sm:text-4xl"><span id="cd-hours"
                                style="--value:0;"></span></span>
                        <span class="text-xs sm:text-sm classic-font mt-1">时</span>
                    </div>

                    <div
                        class="flex-1 max-w-[4.5rem] sm:max-w-[5.5rem] flex flex-col items-center justify-center p-2 sm:p-3 bg-[#fffbf5] border border-[#e6ded5] rounded-box text-[#9e1c26] shadow-sm">
                        <span class="countdown font-mono text-3xl sm:text-4xl"><span id="cd-mins"
                                style="--value:0;"></span></span>
                        <span class="text-xs sm:text-sm classic-font mt-1">分</span>
                    </div>

                    <div
                        class="flex-1 max-w-[4.5rem] sm:max-w-[5.5rem] flex flex-col items-center justify-center p-2 sm:p-3 bg-[#fffbf5] border border-[#e6ded5] rounded-box text-[#9e1c26] shadow-sm">
                        <span class="countdown font-mono text-3xl sm:text-4xl"><span id="cd-secs"
                                style="--value:0;"></span></span>
                        <span class="text-xs sm:text-sm classic-font mt-1">秒</span>
                    </div>

                </div>

                <p class="text-sm text-gray-500 classic-font animate-pulse mt-2">
                    <i class="fa-solid fa-hourglass-half mr-1"></i> 敬请居士稍候...
                </p>
            </div>

            <!-- 区块 1：人机验证与 Steam 登录 -->
            <div id="step-auth" class="flex flex-col items-center gap-6">
                <!-- Turnstile 容器 -->
                <div class="cf-turnstile" data-sitekey="0x4AAAAAADDhFTIqoZVk_a7b" data-theme="light"></div>

                <p class="text-sm text-gray-500 text-font text-center">
                    * 需使用 Steam 授权登录以防止批量倒卖<br>
                    * 本站无法获取您的密码，仅核验身份唯一性
                </p>

                <!-- Steam 官方绿色风格登录按钮 -->
                <button id="btn-steam-login" class="btn w-full text-base md:text-lg shadow-lg"
                    style="background-color: #171a21; color: white; border: none;">
                    <i class="fa-brands fa-steam fa-xl mr-2"></i> 使用 Steam 登录领取
                </button>
            </div>

            <!-- 区块 2：领取成功展示区 -->
            <div id="step-success" class="hidden flex flex-col items-center gap-4">
                <div
                    class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center text-green-600 mb-2 shadow-inner">
                    <i class="fa-solid fa-check fa-2xl"></i>
                </div>
                <h2 class="heading-font text-2xl">领取成功</h2>
                <p class="text-font text-gray-600">您的专属 Steam 激活码为：</p>

                <!-- 激活码展示框 -->
                <div
                    class="w-full bg-gray-100 p-4 rounded-xl text-center border-2 border-dashed border-gray-300 relative group">
                    <span id="cdkey-display"
                        class="font-mono text-lg md:text-xl font-bold tracking-widest text-[#9e1c26] break-all">
                        AAAAA-BBBBB-CCCCC
                    </span>
                    <!-- 悬浮复制提示 -->
                    <div class="absolute inset-0 bg-black/5 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer rounded-xl"
                        onclick="copyKey()">
                        <span class="text-sm font-bold text-gray-700 bg-white px-3 py-1 rounded shadow"><i
                                class="fa-regular fa-copy"></i> 点击复制</span>
                    </div>
                </div>
            </div>

            <!-- 区块 3：发钥完毕/抢空展示区 -->
            <div id="step-empty" class="hidden flex flex-col items-center gap-4 py-6">
                <div
                    class="w-20 h-20 rounded-full bg-gray-100 border-2 border-[#e6ded5] flex items-center justify-center text-gray-400 mb-2 shadow-inner">
                    <i class="fa-solid fa-box-open fa-3x"></i>
                </div>
                <h2 class="heading-font text-2xl text-[#9e1c26]">缘分已满</h2>
                <p class="text-font text-gray-600 text-center leading-relaxed">
                    十分抱歉，馆中备下的激活码已被悉数领走。<br>
                    <span class="text-sm text-gray-500 mt-2 block">期待居士在 Steam 持续关注《石楠小馆》，来日方长。</span>
                </p>
                <a href="https://store.steampowered.com/app/4628980" target="_blank"
                    class="btn btn-outline text-font mt-4">
                    <i class="fa-brands fa-steam mr-2"></i> 前往 Steam 页面
                </a>
            </div>

        </div>
        </div>

        <!-- 页脚 -->
        <footer class="footer footer-center bg-base-100 bg-opacity-80 text-base-content rounded z-[90]">
            <div>
                <p class="text-font">
                    <span class="heading-font text-xl">卦灵AI</span><br />
                    <span class="footer-motto text-xl">融古通今，智解天机</span><br />
                    <a class="text-sm" href="https://yunsisanren.top" target="_blank">@云笥散人</a>
                </p>
            </div>
        </footer>

        <script type="module" src="js/cdkey.js"></script>
    <script src="js/ui-atmosphere.js?v=20260816-nui42"></script>
</body>

</html>
